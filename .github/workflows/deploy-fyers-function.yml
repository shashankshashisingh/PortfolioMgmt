name: Configure and deploy Fyers

# One-button setup: sync Fyers credentials from GitHub Actions secrets to Supabase,
# then deploy the quote proxy. Never print credentials or tokens.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/fyers-quotes/**"
      - ".github/workflows/deploy-fyers-function.yml"

permissions:
  contents: read

concurrency:
  group: deploy-fyers-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      PROJECT_REF: uworsbrulgoylwvxxadh
    steps:
      - uses: actions/checkout@v4
      - name: Validate required repository secrets
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY FYERS_APP_ID FYERS_SECRET_ID FYERS_PIN; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions repository secrets: ${missing[*]}. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        run: npm install --global supabase
      - name: Sync Fyers credentials to Supabase
        run: supabase secrets set FYERS_APP_ID="$FYERS_APP_ID" FYERS_SECRET_ID="$FYERS_SECRET_ID" FYERS_PIN="$FYERS_PIN" --project-ref "$PROJECT_REF"
      - name: Deploy Fyers quote function
        run: supabase functions deploy fyers-quotes --project-ref "$PROJECT_REF"
      - name: Verify setup
        run: echo "Fyers credentials synced and quote function deployed. Run the Fyers login workflow once if no valid token is stored."
