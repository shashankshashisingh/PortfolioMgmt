name: Deploy Fyers quotes function

# Deploys supabase/functions/fyers-quotes to your Supabase project.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (create it at https://supabase.com/dashboard/account/tokens).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-fyers-function.yml"

permissions:
  contents: read

concurrency:
  group: deploy-fyers-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uworsbrulgoylwvxxadh
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # JWT verification stays on (the default), so only signed-in users can call the function.
      - name: Deploy fyers-quotes
        run: supabase functions deploy fyers-quotes --project-ref "$PROJECT_REF"
