name: Fyers login

# Exchanges a fresh Fyers auth code for tokens and stores them in Supabase (public.fyers_auth).
# Run it from the Actions tab for initial setup or when the scheduled refresh workflow reports that fresh authorization is required.
# Tokens are written straight to Supabase and are never printed in this log.
#
# Repository secrets needed: FYERS_APP_ID, FYERS_SECRET_ID, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Optional repository variable: FYERS_REDIRECT_URI (only if your Fyers app does not use the default).

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "The auth_code from the Fyers redirect URL (or paste the whole redirect URL)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fyers-login
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exchange auth code and store tokens
        env:
          FYERS_AUTH_CODE: ${{ inputs.auth_code }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_REDIRECT_URI: ${{ vars.FYERS_REDIRECT_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fyers-login.mjs
