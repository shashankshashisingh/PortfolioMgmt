name: Update MFapi mutual fund NAVs

on:
  schedule:
    # MFapi updates NAV data multiple times daily; this is a daily cache refresh.
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-mf-nav.mjs"
      - "tests/mf-nav.test.js"
      - ".github/workflows/update-mf-nav.yml"

permissions:
  contents: write

concurrency:
  group: update-mf-nav
  cancel-in-progress: false

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/mf-nav.test.js
      - run: node scripts/fetch-mf-nav.mjs
      - name: Commit latest MFapi NAV file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mf-nav.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MFapi mutual fund NAVs"
            for i in 1 2 3; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo "Rebase conflict; aborting and retrying with the latest remote state."
                git rebase --abort || true
                sleep 5
                continue
              fi
              if git push; then
                exit 0
              fi
              echo "Push was rejected; retrying against the latest main."
              sleep 5
            done
            echo "Could not publish the NAV update after 3 attempts."
            exit 1
          else
            echo "No NAV changes to commit."
          fi
