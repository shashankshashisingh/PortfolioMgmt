name: Refresh Fyers token

# Fyers access tokens expire daily. Renew shortly after 6:00 AM IST using the
# stored refresh token. If Fyers stops accepting refresh tokens or the refresh
# token itself expires, this job fails visibly and a fresh authorization is needed.
on:
  schedule:
    - cron: "35 0 * * *" # 06:05 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fyers-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh token and save it to Supabase
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-fyers-token.mjs
